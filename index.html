<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <button id="new-book-btn">New Book</button>
    <dialog id="my-dialog">
        <form action="#" method="post">
            <div class="title">
                <label for="book-title">Title:</label>
                <input type="text" id="book-title" name="book-title" required>
            </div>
            <div class="author">
                <label for="book-author">Author:</label>
                <input type="text" id="book-author" name="book-author" required>
            </div>
            <div class="pages">
                <label for="book-pages">Pages:</label>
                <input type="number" id="book-pages" name="book-pages" min="1" max="10000" step="1" placeholder="1" required>
            </div>
            <div class="haveRead">
                <input type="checkbox" id="book-read" name="book-read" checked>
                <label for="book-read">Read</label>
            </div>
            <button type="submit" id="form-submit">Submit</button>
        </form>
    </dialog>
    <div class="display"></div>
</body>
</html>
